name: 🤖 AI Job Alert Bot

on:
  schedule:
    - cron: "0 * * * *"   # Every 1 hour, 24/7, FREE
  workflow_dispatch:        # Manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix Node.js 20 deprecation warning

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🤖 Run Job Alert Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:      ${{ secrets.GOOGLE_CSE_ID }}
        run: python job_alert.py

      - name: 💾 Save seen_jobs.json
        run: |
          git config user.name  "Job Alert Bot"
          git config user.email "bot@github.com"
          git add seen_jobs.json || true
          git diff --cached --quiet || git commit -m "🤖 seen jobs [$(date '+%d %b %Y %H:%M')]"
          git push || true
