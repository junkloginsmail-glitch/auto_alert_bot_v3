name: 🤖 AI Job Alert Bot

on:
  schedule:
    - cron: "0 */3 * * *"   # Every 3 hours (8 runs/day)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip install requests playwright playwright-stealth
          playwright install --with-deps chromium

      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🤖 Run Job Alert Bot
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY:      ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:       ${{ secrets.GOOGLE_CSE_ID }}
          SCRAPER_API_KEY:     ${{ secrets.SCRAPER_API_KEY }}
          NAUKRI_EMAIL:        ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD:     ${{ secrets.NAUKRI_PASSWORD }}
        run: python job_alert.py

      - name: 💾 Save seen_jobs.json (keeps ALL IDs — no deletion)
        run: |
          git config user.name  "Job Alert Bot"
          git config user.email "bot@github.com"
          git add seen_jobs.json || true
          git diff --cached --quiet || git commit -m "🤖 update [$(date '+%d %b %Y %H:%M')]"
          git push || true
